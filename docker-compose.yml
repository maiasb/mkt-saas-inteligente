services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-dreams_indicacoes}
      MYSQL_USER: ${DB_USER:-dreams}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dreams}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_EXPOSED_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica as migrations e encerra; o app só sobe depois que ela termina com sucesso
  migrate:
    image: dreams-indicacoes:local
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    command: ["node", "database/migrate.js"]
    environment: &db_env
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dreams}
      DB_PASSWORD: ${DB_PASSWORD:-dreams}
      DB_NAME: ${DB_NAME:-dreams_indicacoes}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: dreams-indicacoes:local
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      <<: *db_env
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      GUARA_API_URL: ${GUARA_API_URL:-}
      GUARA_API_TOKEN: ${GUARA_API_TOKEN:-}
      LIMBER_CARD_API_URL: ${LIMBER_CARD_API_URL:-}
      LIMBER_CARD_USER: ${LIMBER_CARD_USER:-}
      LIMBER_CARD_PASSWORD: ${LIMBER_CARD_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
